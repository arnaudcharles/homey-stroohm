<header class="homey-header">
  <h1 class="homey-title" data-i18n="pair.credentials.title"></h1>
</header>

<form class="homey-form" id="form">
  <div class="homey-form-group">
    <label class="homey-form-label" for="clientId" data-i18n="pair.credentials.clientId"></label>
    <input class="homey-form-input" id="clientId" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"/>
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" for="clientSecret" data-i18n="pair.credentials.clientSecret"></label>
    <input class="homey-form-input" id="clientSecret" type="password" autocomplete="off"/>
  </div>
  <button class="homey-button-primary-full" id="connect" type="submit" data-i18n="pair.credentials.connect"></button>
</form>

<script type="application/javascript">
  const form = document.getElementById('form');
  const btn = document.getElementById('connect');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('clientId').value.trim();
    const password = document.getElementById('clientSecret').value.trim();
    if (!username || !password) {
      Homey.alert(Homey.__('pair.credentials.missing'), 'warning');
      return;
    }
    btn.classList.add('is-loading');
    btn.disabled = true;
    try {
      await Homey.emit('login', { username, password });
      Homey.showView('setup');
    } catch (err) {
      Homey.alert((err && err.message) || String(err), 'error');
    } finally {
      btn.classList.remove('is-loading');
      btn.disabled = false;
    }
  });
</script>
